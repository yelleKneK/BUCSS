url: https://yelleKneK.github.io/BUCSS

template:
  bootstrap: 5

reference:
- title: t Tests
  desc: >
    One-sample, independent, dependent (paired), and unequal-variance (Welch)
    t test designs, that is, the standardized mean difference.
  contents:
  - ss_buc_independent_t
  - ss_buc_paired_t
  - ss_buc_one_sample_t
  - ss_buc_welch_t
- title: Between-Subjects ANOVA and ANCOVA
  desc: One-way, two-way, and general between-subjects designs, with or without covariates, planned per group or per cell.
  contents:
  - ss_buc_one_way_anova
  - ss_buc_factorial_anova
  - ss_buc_factorial_anova_general
  - ss_buc_ancova
- title: Within-Subjects ANOVA
  desc: Repeated measures designs, planned on the total number of subjects.
  contents:
  - ss_buc_rm_anova
  - ss_buc_rm_anova_general
- title: Split-Plot (Mixed) ANOVA
  desc: Designs crossing a between-subjects factor with a within-subjects factor.
  contents:
  - ss_buc_mixed_anova
  - ss_buc_mixed_anova_general
- title: Correlation and Multiple Regression
  desc: A Pearson correlation, a single coefficient, the omnibus model R2, or a joint subset of predictors.
  contents:
  - ss_buc_correlation
  - ss_buc_reg_coef
  - ss_buc_R2
  - ss_buc_reg_joint

- title: Multivariate and Latent Variable Designs
  desc: A two-group multivariate comparison, and the chi-square difference test between nested models.
  contents:
  - ss_buc_manova
  - ss_buc_chisq_diff
- title: Auditing a Plan
  desc: >
    Simulate the literature a plan came from and see how often a plan built
    this way actually reaches the target power.
  contents:
  - ss_buc_sensitivity
  - print.bucss_sensitivity
- title: The Result Object
  desc: Working with the tidy bucss_power object the planners return.
  contents:
  - print.bucss_power
  - bucss_tidiers
  - planning_sentence
- title: Deprecated 1.x Functions
  desc: The dot-named 1.x API, kept working as thin wrappers around the ss_buc_* planners.
  contents:
  - bucss-deprecated
- title: Package Overview
  desc: The package-level help page, with the method and its references.
  contents:
  - BUCSS-package

articles:
- title: Articles
  navbar: ~
  contents:
  - BUCSS
  - planning-replications
  - understanding-assurance
  - reading-output
  - worked-examples
